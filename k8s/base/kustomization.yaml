apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - server-deployment.yaml
  - server-service.yaml
  - client-deployment.yaml
  - client-service.yaml

images:
  - name: docker.io/yourname/spring-boot-server
    newName: docker.io/yourname/spring-boot-server
    newTag: latest
  - name: docker.io/yourname/react-client
    newName: docker.io/yourname/react-client
    newTag: latest

commonLabels:
  app.kubernetes.io/managed-by: argo-cd
